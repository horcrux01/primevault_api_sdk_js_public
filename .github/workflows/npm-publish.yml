name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm install

      - name: Build your package
        run: npm run build

      - name: Run tests (FYI only, does not block publish)
        continue-on-error: true
        env:
          ACCESS_PRIVATE_KEY: ${{ secrets.ACCESS_PRIVATE_KEY_TEST }}
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # 1.0.x backport: 2.0.x is already the highest published version, so npm
        # will not implicitly apply the `latest` tag. Set it explicitly so 1.0.41
        # becomes `latest` (same end result as the bare publish used for 1.0.40).
        run: npm publish --provenance --access public --tag latest
